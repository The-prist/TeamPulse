# =====================================================================
# TeamPulse 一键部署编排（面向单台 4C4G 轻量云服务器）
#
# 内存预算（4G 总内存的分配思路）：
#   mysql      1.0G   —— innodb_buffer_pool_size=384M，够中小数据量
#   backend    1.0G   —— JVM -Xmx768m，堆外留给元空间/直接内存
#   redis      192M   —— 只做 nonce 去重与热点缓存，maxmemory=128M
#   mosquitto    64M   —— 纯内存转发，消息不做持久堆积
#   nginx        64M   —— 静态资源 + 反向代理
#   合计约 2.3G，留出 1.5G 给系统与突发流量
#
# 启动：cp .env.example .env && vim .env && docker compose up -d --build
# =====================================================================

name: teampulse

services:
  mysql:
    image: mysql:8.0
    container_name: tp-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max-connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-teampulse}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/conf.d:/etc/mysql/conf.d:ro
    ports:
      # 只绑回环，禁止公网直连数据库；需要临时连库用 SSH 隧道
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1g
    logging: &default-logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: tp-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192m
    logging: *default-logging

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: tp-mosquitto
    restart: unless-stopped
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data
    ports:
      # ESP32 需要从外网连入，必须暴露；务必改默认账号密码
      - "1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/uptime' -u ${MQTT_USERNAME} -P ${MQTT_PASSWORD} -C 1 -W 3 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 64m
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: teampulse/backend:1.0.0
    container_name: tp-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-teampulse}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_CLIENT_ID: teampulse-backend-1
      TPP_JWT_SECRET: ${JWT_SECRET}
      TPP_CORS_ORIGINS: ${TPP_CORS_ORIGINS:-}
      TPP_ATTENDANCE_SIGN_ENABLED: "true"
      TPP_BOOTSTRAP_ENABLED: ${TPP_BOOTSTRAP_ENABLED:-true}
      # 刻意不给默认值：漏配时 compose 直接报错，而不是悄悄用 admin123 建出弱口令管理员
      TPP_ADMIN_PASSWORD: "${TPP_ADMIN_PASSWORD:?请先在 .env 中设置 TPP_ADMIN_PASSWORD}"
      TPP_OPENAPI_ENABLED: ${TPP_OPENAPI_ENABLED:-false}
      JAVA_OPTS: "-XX:MaxRAMPercentage=70 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Duser.timezone=Asia/Shanghai -Dfile.encoding=UTF-8"
      TZ: Asia/Shanghai
    volumes:
      - backend-logs:/app/logs
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api/v1
    image: teampulse/frontend:1.0.0
    container_name: tp-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "80:80"
      # 配好证书后放开 443
      # - "443:443"
    volumes:
      # 若启用 HTTPS，把证书目录挂进来
      - ./deploy/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64m
    logging: *default-logging

volumes:
  mysql-data:
  redis-data:
  mosquitto-data:
  backend-logs:
