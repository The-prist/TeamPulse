# =====================================================================
# Nginx：静态资源托管 + API 反向代理（同源部署，无需 CORS）
# =====================================================================

upstream teampulse_backend {
    # 后端容器名由 docker compose 的 DNS 解析
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 20m;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection          "1; mode=block"  always;

    # ---- 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;

    # ---- 容器健康检查 ----
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- 后端 API ----
    location /api/ {
        proxy_pass         http://teampulse_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # JWT 校验很快，10s 足够；避免后端卡死时连接堆积
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # 不缓存接口响应
        add_header Cache-Control "no-store" always;
    }

    # ---- 设备 HTTP 兜底接入 ----
    location /iot/ {
        proxy_pass         http://teampulse_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        # 设备上报频率低，限流交给后端签名校验
        proxy_read_timeout 15s;
    }

    # ---- 健康检查接口不对外暴露细节 ----
    location /actuator/ {
        proxy_pass http://teampulse_backend;
        # 仅允许内网访问
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
    }

    # ---- 带内容哈希的静态资源：强缓存一年 ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---- SPA history 路由回退：/kanban/3 这类前端路由必须落到 index.html ----
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 不缓存，保证发版后用户立刻拿到新资源引用
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}

