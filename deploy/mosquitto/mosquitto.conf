# =====================================================================
# Mosquitto 配置（物联网打卡机接入）
# =====================================================================

listener 1883 0.0.0.0
protocol mqtt

# 禁止匿名：ESP32 固件里填 MQTT_USERNAME / MQTT_PASSWORD
allow_anonymous false
password_file /mosquitto/config/passwd

# 持久化：进程重启后保留会话与未投递消息，避免打卡报文丢失
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

# 单客户端消息上限（打卡报文很小，64KB 足够，防止异常固件打爆内存）
max_packet_size 65536
max_queued_messages 200
max_inflight_messages 20

# 日志
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# 保活：设备侧自己决定 keepalive（固件里是 60s）；服务端限制上限 120s，
# 避免客户端要求过长的保活周期导致"假在线"。
# 注意：keepalive_interval 是 bridge 专用参数，broker 配置里写它会直接启动失败。
max_keepalive 120
