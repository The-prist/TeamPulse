# ⚠️ 状态说明（2026-10-27）
# 本流水线保留作为配置留存，但当前**不期望在 GitHub 上运行成功**：
# 账号因账单问题被锁定，job 无法分配 runner（见 docs/部署验证记录.md）。
# 该限制已按决策终止推进；日常请在本地执行 scripts/run-tests.ps1 做等价验证。
#
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交取消上一次未完成的构建，避免排队
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（编译 + 单元测试）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: 编译并运行单元测试
        working-directory: backend
        # 单元测试（AttendanceCalculatorTest）不依赖数据库，可直接跑；
        # 集成测试（Testcontainers）需要 Docker，等补上后再拆成独立 job。
        run: mvn -B -ntp clean test

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/**
          if-no-files-found: ignore

  frontend:
    name: 前端（构建）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 生产构建
        working-directory: frontend
        run: pnpm build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  e2e:
    name: 接口端到端（起真实依赖）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          # 未配置 CI_MYSQL_PASSWORD 时用兜底值（仅 CI 临时库，非真实密钥）
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD || 'ci-root-pwd' }}
          MYSQL_DATABASE: teampulse
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-pwd"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: 启动后端（MQTT/Redis 关闭，走 HTTP 通道）
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD || 'ci-root-pwd' }}
          MQTT_ENABLED: 'false'
          SPRING_PROFILES_ACTIVE: dev
        run: |
          mvn -B -ntp -DskipTests spring-boot:run > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "后端已就绪（${i}0s 内）"; exit 0
            fi
            sleep 10
          done
          echo "后端启动超时，日志尾部："; tail -50 /tmp/backend.log; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: 跑接口端到端断言
        # 首次启动的演示数据里没有启用设备，写入类用例会自动跳过；
        # 若将来补了种子设备，可去掉 --read-only。
        run: node tests/api/e2e.mjs --read-only
      - name: 失败时导出后端日志
        if: failure()
        run: tail -100 /tmp/backend.log
  contract:
    name: 契约检查（迁移脚本与配置）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 校验 Flyway 迁移命名规范
        run: |
          set -e
          cd backend/src/main/resources/db/migration
          ls *.sql | sort > /tmp/actual.txt
          echo "发现迁移："; cat /tmp/actual.txt
          # 版本号必须连续且以 V 开头，例如 V1__xxx.sql
          bad=$(grep -vE '^V[0-9]+__[a-z0-9_]+\.sql$' /tmp/actual.txt || true)
          if [ -n "$bad" ]; then
            echo "以下迁移文件命名不符合 V<数字>__<小写下划线>.sql："
            echo "$bad"
            exit 1
          fi

      - name: 准备 YAML 解析器
        run: pip install --quiet pyyaml

      - name: 校验 application.yml 可被解析
        run: |
          python3 - <<'PY'
          import sys, yaml
          with open('backend/src/main/resources/application.yml', encoding='utf-8') as f:
              data = yaml.safe_load(f)
          assert isinstance(data, dict) and 'spring' in data, 'application.yml 结构异常'
          print('application.yml 解析通过，顶层键：', ', '.join(sorted(data.keys())))
          PY

  # ---------------------------------------------------------------- 静态检查
  # 抓「用了 x.value 却未声明 x」这类只在渲染期才炸的错误。
  # 2026-10-27 日程详情页白屏即此类；接口测试全绿也发现不了。
  static-audit:
    name: 静态检查（渲染级错误 / 控件清单）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 扫描未声明的 ref 引用
        run: python scripts/audit/check_undefined_refs.py

      - name: 抽取前端交互控件清单
        run: python scripts/audit/extract_buttons.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: button-inventory
          path: .run-logs/button-inventory.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------- 全栈冒烟
  # 起真实 compose 全栈 → 灌演示数据 → 接口矩阵 + 浏览器冒烟。
  # 覆盖「接口 200 但页面白屏」这类接口测不到的回归。
  ui-smoke:
    name: 浏览器冒烟 + 接口矩阵（全栈）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成 CI 用 .env（密码取自 secrets，JWT 现场生成）
        env:
          # 未配置 CI_MYSQL_PASSWORD 时用占位值；仅用于 CI 临时库，不是真实密钥
          CI_DB_PWD: ${{ secrets.CI_MYSQL_PASSWORD || 'ci-local-placeholder' }}
        run: |
          set -euo pipefail
          cat > .env <<EOF
          DB_NAME=teampulse
          MYSQL_ROOT_PASSWORD=${CI_DB_PWD}
          REDIS_PASSWORD=${CI_DB_PWD}
          MQTT_USERNAME=teampulse
          MQTT_PASSWORD=${CI_DB_PWD}
          JWT_SECRET=$(openssl rand -hex 32)
          TPP_BOOTSTRAP_ENABLED=true
          TPP_ADMIN_PASSWORD=${CI_DB_PWD}
          TPP_OPENAPI_ENABLED=false
          TPP_CORS_ORIGINS=
          GRAFANA_ADMIN_PASSWORD=${CI_DB_PWD}
          EOF
          echo "已生成 .env（密码来自 CI_DB_PWD，JWT 每次现场生成）"

      - name: 构建并启动全栈
        run: docker compose up -d --build mysql redis mosquitto backend frontend

      - name: 等待容器健康
        run: |
          set -uo pipefail
          for i in $(seq 1 72); do
            b=$(docker inspect --format '{{.State.Health.Status}}' tp-backend 2>/dev/null || echo none)
            f=$(docker inspect --format '{{.State.Health.Status}}' tp-frontend 2>/dev/null || echo none)
            echo "[$((i*5))s] backend=$b frontend=$f"
            if [ "$b" = "healthy" ] && [ "$f" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          echo "容器未就绪，后端日志："
          docker compose logs --tail=120 backend
          exit 1

      - name: 灌演示数据（基础种子 → 20 账号 → 全量业务数据）
        run: |
          set -euo pipefail
          P=$(grep '^MYSQL_ROOT_PASSWORD=' .env | cut -d= -f2)
          M() { docker exec -i tp-mysql mysql -uroot -p"$P" --default-character-set=utf8mb4 teampulse; }
          M < deploy/sql/seed-demo.sql
          M < deploy/sql/seed-extra-users.sql
          docker exec tp-mysql mysql -uroot -p"$P" -N -B teampulse -e \
            "SELECT CONCAT_WS('|', user_id, IFNULL(employee_no,'NONE'), role, IFNULL(department_id,0), username, IFNULL(nickname,'')) FROM user WHERE deleted=0 ORDER BY user_id;" > /tmp/users.tsv
          echo "账号映射行数: $(wc -l < /tmp/users.tsv)"
          python3 scripts/docs/gen_demo_data.py --out /tmp/seed-extra.sql --users /tmp/users.tsv
          M < /tmp/seed-extra.sql
          docker exec tp-mysql mysql -uroot -p"$P" -N -B teampulse -e \
            "SELECT CONCAT('users=', COUNT(*)) FROM user WHERE deleted=0;"
          docker exec tp-mysql mysql -uroot -p"$P" -N -B teampulse -e \
            "SELECT CONCAT('teams=', COUNT(*)) FROM team WHERE deleted=0;"

      - name: 接口矩阵（6 角色 × 83 接口）
        run: node scripts/audit/button-e2e.mjs --base=http://127.0.0.1

      - name: 安装 Playwright 与 Chromium
        run: |
          set -euo pipefail
          cd tests/ui
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 浏览器冒烟（6 角色 × 各自页面）
        env:
          BASE: http://127.0.0.1
          CHANNEL: ''
        run: node tests/ui/smoke.mjs

      - name: 失败时导出后端日志
        if: failure()
        run: docker compose logs --tail=200 backend

      - name: 清理
        if: always()
        run: docker compose down -v
